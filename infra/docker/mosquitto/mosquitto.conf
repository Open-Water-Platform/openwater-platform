# Mosquitto configuration for local development only.
#
# IMPORTANT: anonymous access is enabled here purely so contributors can
# run the platform locally without setting up credentials. This config
# MUST NOT be used unmodified in any deployment reachable from outside
# localhost. Per-device username/password and ACLs land in a follow-up
# infra hardening pass.

# Listen on the standard MQTT port, on every interface inside the
# container; the host port mapping in docker-compose.yml decides which
# of those are reachable from outside the container.
listener 1883 0.0.0.0

# No authentication for local dev. Combined with the localhost-only port
# mapping in docker-compose.yml this is acceptable for a developer
# machine and nowhere else.
allow_anonymous true

# Persist retained messages, subscriptions, and queued QoS 1/2 messages
# across broker restarts. Backed by the named volume mosquitto_data in
# docker-compose.yml.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Log to stdout so `docker compose logs mosquitto` shows everything.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
