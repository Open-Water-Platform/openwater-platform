[project]
name = "owp-backend"
version = "0.1.0"
description = "Open Water Platform backend: read-only REST API for devices and sensor readings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Open Water Platform contributors" },
]
keywords = ["fastapi", "iot", "water-quality", "api", "open-water-platform"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5.0,<7",
  "pytest-mock>=3.12,<4",
]

[project.scripts]
owp-backend = "owp_backend.main:run"

[project.urls]
Homepage = "https://github.com/Open-Water-Platform/openwater-platform"
Repository = "https://github.com/Open-Water-Platform/openwater-platform"
Issues = "https://github.com/Open-Water-Platform/openwater-platform/issues"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["owp_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: fast in-process tests with no external dependencies",
  "integration: tests that require external services (Postgres, etc.)",
]
